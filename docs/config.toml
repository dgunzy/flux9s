baseURL = 'https://flux9s.ca/'
title = 'flux9s'
description = 'A K9s-inspired terminal UI for monitoring Flux GitOps resources in real-time'

# Language settings
locale = 'en'
defaultContentLanguage = 'en'

# Theme configuration
theme = ['github.com/docsy/docsy/theme']

# Hugo configuration
enableGitInfo = true
enableRobotsTXT = true
enableEmoji = true

# Build settings
buildDrafts = false
buildFuture = false

# Markup settings
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

# Menu configuration
[menu]
  [[menu.main]]
    name = "Getting Started"
    url = "/getting-started/"
    weight = 2
  [[menu.main]]
    name = "User Guide"
    url = "/user-guide/"
    weight = 3
  [[menu.main]]
    name = "Configuration"
    url = "/configuration/"
    weight = 4
  [[menu.main]]
    name = "Developer Guide"
    url = "/developer-guide/"
    weight = 5
  [[menu.main]]
    name = "Flux Docs"
    url = "https://fluxcd.io/flux/"
    weight = 6
    post = ' <i class="fa-solid fa-arrow-up-right-from-square fa-xs"></i>'
    [menu.main.params]
      external = true

# Parameters
[params]
  # Project information
  github_repo = "https://github.com/dgunzy/flux9s"
  github_branch = "main"
  github_subdir = "docs"

  # Docsy's built-in client-side search (no external service)
  offlineSearch = true
  offlineSearchSummaryLength = 120
  
  # UI settings
  [params.ui]
    sidebar_menu_compact = false
    sidebar_menu_foldable = true
    sidebar_search_disable = true  # the navbar has the search box
    breadcrumb_disable = false
    sidebar_menu_sticky = true
    navbar_logo = false
    navbar_align = "left"
    # Content width - make it wider
    content_width = "wide"
    # Docsy's built-in light / dark / auto menu in the navbar
    showLightDarkModeMenu = true
  
  
  # Links
  [[params.links.user]]
    name = "GitHub"
    url = "https://github.com/dgunzy/flux9s"
    icon = "fa-brands fa-github"
    desc = "View source code on GitHub"
  [[params.links.user]]
    name = "Crates.io"
    url = "https://crates.io/crates/flux9s"
    icon = "fa-solid fa-box"
    desc = "View on crates.io"
  [[params.links.user]]
    name = "Homebrew"
    url = "https://github.com/dgunzy/homebrew-tap"
    icon = "fa-solid fa-beer-mug-empty"
    desc = "Install via Homebrew"

# Taxonomies
[taxonomies]
  category = "categories"
  tag = "tags"

# Custom output formats
[outputs]
  # LLMS: Docsy's llms.txt (a plain-text map of the docs for AI agents)
  home = ["HTML", "RSS", "LLMS"]
