# source-watcher resources — ArtifactGenerator produces ExternalArtifacts
# from the flux-system GitRepository (both kinds are watched by flux9s; the
# graph view supports ArtifactGenerator fan-out).
#
#   GitRepository/flux-system ─► ArtifactGenerator/example-apps ─► ExternalArtifact(s)
apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata:
  name: example-apps
  namespace: flux-resources
  labels: {app.kubernetes.io/managed-by: flux9s-dev}
spec:
  sources:
    - alias: repo
      kind: GitRepository
      name: flux-system
  artifacts:
    - name: apps-base
      copy:
        - from: "@repo/apps/base/**"
          to: "@artifact/"
    - name: apps-staging
      copy:
        - from: "@repo/apps/staging/**"
          to: "@artifact/"
---
# Cross-namespace artifacts (Flux 2.10): the generator lives in
# flux-resources, its ExternalArtifact in flux-artifacts. The controller
# checks (SubjectAccessReview) that spec.serviceAccountName may write
# ExternalArtifacts in the target namespace.
#
#   ArtifactGenerator/flux-resources/cross-namespace ─► ExternalArtifact/flux-artifacts/apps-shared
apiVersion: v1
kind: Namespace
metadata:
  name: flux-artifacts
  labels: {app.kubernetes.io/managed-by: flux9s-dev}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: artifact-writer
  namespace: flux-resources
  labels: {app.kubernetes.io/managed-by: flux9s-dev}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: artifact-writer
  namespace: flux-artifacts
  labels: {app.kubernetes.io/managed-by: flux9s-dev}
rules:
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["externalartifacts", "externalartifacts/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: artifact-writer
  namespace: flux-artifacts
  labels: {app.kubernetes.io/managed-by: flux9s-dev}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: artifact-writer
subjects:
  - kind: ServiceAccount
    name: artifact-writer
    namespace: flux-resources
---
apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata:
  name: cross-namespace
  namespace: flux-resources
  labels: {app.kubernetes.io/managed-by: flux9s-dev}
spec:
  serviceAccountName: artifact-writer
  sources:
    - alias: repo
      kind: GitRepository
      name: flux-system
  artifacts:
    - name: apps-shared
      namespace: flux-artifacts
      copy:
        - from: "@repo/apps/base/**"
          to: "@artifact/"
---
# A Kustomization consuming an ExternalArtifact from another namespace,
# applied by a Kustomization there — the graph must show its own lineage
# (ExternalArtifact ─► ArtifactGenerator ─► GitRepository), with the parent
# beside it as manager, not the parent's source. Suspended: only its spec
# matters (apps-base would collide with the apps Kustomization's podinfo),
# and the manager labels stand in for the parent having applied it.
#
#   GitRepository/flux-system ─► ArtifactGenerator/example-apps ─► ExternalArtifact/apps-base
#                                                                       │
#                        Kustomization/flux-resources/infra-configs ──► Kustomization/flux-artifacts/shared-apps
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: shared-apps
  namespace: flux-artifacts
  labels:
    app.kubernetes.io/managed-by: flux9s-dev
    kustomize.toolkit.fluxcd.io/name: infra-configs
    kustomize.toolkit.fluxcd.io/namespace: flux-resources
spec:
  suspend: true
  interval: 10m
  prune: false
  path: ./
  sourceRef:
    kind: ExternalArtifact
    name: apps-base
    namespace: flux-resources
